<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 格式化 · DevToolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M13 10l-4 6 4 6M19 10l4 6-4 6' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/app.css?v=202610271643">
<script src="../js/app.js?v=202610271643"></script>
<style>
  /* ------------------------------------------------ json.cn 风格的 JSON 树 */
  :root {
    --jk: #92278f;        /* 键名：紫红 */
    --jstr: #009900;      /* 字符串：绿 */
    --jnum: #0a00d8;      /* 数字：蓝 */
    --jbool: #d25b0e;     /* 布尔 */
    --jnull: #d25b0e;     /* null */
    --jpunct: #444;       /* 括号/冒号/逗号 */
    --jtoggle: #e8483f;   /* 折叠方块：红 */
    --jdots: #999;
  }
  :root[data-theme="dark"] {
    --jk: #c678dd;
    --jstr: #98c379;
    --jnum: #61afef;
    --jbool: #d19a66;
    --jnull: #d19a66;
    --jpunct: #9aa5b4;
    --jtoggle: #e8483f;
    --jdots: #6d7889;
  }

  .out.jout {
    counter-reset: jline;
    padding: 10px 0;
    font-size: 13px;
    line-height: 1.75;
  }

  .jline {
    display: flex;
    counter-increment: jline;
    padding-right: 16px;
  }
  .jline:hover { background: rgba(127,127,127,.05); }

  .jln {
    flex: 0 0 auto;
    width: 2.8em;
    padding-right: 10px;
    text-align: right;
    color: var(--muted);
    opacity: .55;
    user-select: none;
    -webkit-user-select: none;
  }
  .jln::before { content: counter(jline); }

  .jcode { white-space: pre; flex: 1 1 auto; min-width: 0; }

  /* 折叠开关：FeHelper 式小箭头 */
  .jt {
    display: inline-grid;
    place-items: center;
    width: 14px; height: 14px;
    margin-right: 5px;
    color: var(--muted);
    font: 700 9px/1 ui-monospace, Menlo, monospace;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    vertical-align: -1px;
    border-radius: 4px;
    transition: color .12s ease, background .12s ease;
  }
  .jt:hover { color: var(--accent); background: var(--accent-soft); }
  .jt.leaf { visibility: hidden; }

  .jnode { position: relative; }
  .jnode > .jline .jt::before { content: "▼"; }
  .jnode.collapsed > .jline .jt::before { content: "▶"; }

  /* 开括号到闭括号的虚线引导线：在父节点括号列位置 */
  .jnode::before {
    content: "";
    position: absolute;
    left: calc(2.8em + 10px + 19px + var(--d, 0) * 2ch - 2px);
    top: 1.75em;
    bottom: 1.75em;
    border-left: 1px dashed var(--jguide);
    pointer-events: none;
  }
  :root { --jguide: rgba(127,127,127,.35); }

  /* 悬停开括号行或闭括号行：高亮整个块（开始到结束） */
  .jnode:has(> .jline:first-child:hover),
  .jnode:has(> .jline.jclose:hover) {
    background: var(--hl);
    border-radius: 6px;
  }

  /* 可点击的开括号 */
  .jclick { cursor: pointer; }
  .jclick:hover { color: var(--accent); }

  /* 输入区弱化：文字用柔和的次要色，视觉重心放在右侧结果 */
  #input { color: var(--muted); font-size: 13px; }
  #input::selection { background: var(--sel); }

  /* 醒目的模式切换控件 */
  .seg.prominent { padding: 3px; border-radius: 10px; }
  .seg.prominent button {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 18px;
  }
  .seg.prominent button[aria-pressed="true"] {
    background: linear-gradient(145deg, #6d6ff2, #5548d6);
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99,102,241,.8);
  }

  /* ------------------------------------------------ 表格视图弹窗 */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: grid; place-items: center;
    z-index: 50;
    animation: fadeIn .15s ease both;
  }
  .modal-mask.hidden { display: none; }
  .modal-panel {
    width: min(920px, 92vw);
    max-height: 82vh;
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp .2s ease both;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: var(--panel-head);
    border-bottom: 1px solid var(--border-soft);
  }
  .modal-head .pane-title { font-size: 13px; }
  .modal-body { overflow: auto; padding: 0; }
  .modal-body table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12.5px;
  }
  .modal-body th, .modal-body td {
    border-bottom: 1px solid var(--border-soft);
    border-right: 1px solid var(--border-soft);
    padding: 7px 12px;
    text-align: left;
    white-space: nowrap;
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-body th {
    position: sticky; top: 0;
    background: var(--panel-head);
    color: var(--fg-strong);
    font-weight: 600;
    z-index: 1;
  }
  .modal-body tr:hover td { background: rgba(127,127,127,.05); }
  .modal-body td.nested { color: var(--muted); font-style: italic; }
  .modal-body .rownum {
    color: var(--muted); opacity: .6;
    text-align: right; font-variant-numeric: tabular-nums;
  }

  .jk     { color: var(--jk); font-weight: 600; }
  .jstr   { color: var(--jstr); }
  .jnum   { color: var(--jnum); }
  .jbool  { color: var(--jbool); }
  .jnull  { color: var(--jnull); }
  .jp     { color: var(--jpunct); }

  .jchildren { display: block; }
  .jnode.collapsed > .jchildren { display: none; }
  .jnode.collapsed > .jline .jt::before { content: "+"; }
  .jnode:not(.collapsed) > .jline .jt::before { content: "−"; }
  .jdots { display: none; color: var(--jdots); }
  .jnode.collapsed > .jdots { display: block; }

  /* 折叠后的摘要：{ … 3 items } */
  .jsummary { color: var(--jdots); font-style: italic; }

  .jclick { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a class="brand-link" href="../index.html" title="返回首页">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 8l4 4-4 4M11 8l-4 4 4 4"/>
          </svg>
        </div>
        <div>
          <h1>JSON 格式化</h1>
          <p class="sub">格式化、压缩、校验 JSON，错误定位行列</p>
        </div>
      </a>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="opts">
      <div class="opt">
        <span class="opt-label">缩进</span>
        <div class="seg" id="segIndent" role="group" aria-label="缩进宽度">
          <button data-value="2">2 空格</button>
          <button data-value="4">4 空格</button>
          <button data-value="tab">Tab</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">键名</span>
        <div class="seg" id="segSort" role="group" aria-label="键名排序">
          <button data-value="keep">保持原序</button>
          <button data-value="asc">字母升序</button>
        </div>
      </div>
      <div class="opt">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--muted)">
          <input type="checkbox" id="keepEsc" style="accent-color:var(--accent);width:14px;height:14px">
          保留 \uXXXX 转义
        </label>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn">示例</button>
      <div class="seg prominent" id="segMode" role="group" aria-label="显示模式">
        <button data-value="pretty">☰ 格式化</button>
        <button data-value="compress">≡ 压缩</button>
      </div>
      <button class="btn" id="toggleBtn">全部折叠</button>
      <button class="btn" id="tableBtn">表格视图</button>
      <button class="btn" id="fullBtn">全屏</button>
    </div>
  </div>

  <main class="panes asym">
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title">输入</span>
        <span class="hint">保持粘贴的原格式</span>
      </div>
      <textarea id="input" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder='{"name":"张三","age":18,"tags":["dev","mac"]}'></textarea>
      <div class="warn" id="warn"></div>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span class="pane-title" id="outTitle">格式化结果</span>
        <div class="pane-tools">
          <span class="stats" id="stats"></span>
          <button class="btn tiny" id="copyBtn">复制</button>
          <button class="btn tiny" id="downloadBtn">下载</button>
        </div>
      </div>
      <div class="out jout" id="out"></div>
    </section>
  </main>

  <div class="modal-mask hidden" id="tableModal">
    <div class="modal-panel">
      <div class="modal-head">
        <span class="pane-title">表格视图 · <span id="tableNote"></span></span>
        <div class="pane-tools">
          <button class="btn tiny" id="csvBtn">下载 CSV</button>
          <button class="btn tiny" id="mdBtn">下载 MD</button>
          <button class="btn tiny" id="tableCloseBtn">关闭 (Esc)</button>
        </div>
      </div>
      <div class="modal-body" id="tableOut"></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SAMPLE = '{"title":"JSON在线解析","json.url":"https://wangmyhome.github.io/devtoolbox/tools/json.html",'
    + '"keywords":"JSON在线解析","Function":["JSON美化","JSON数据类型显示",'
    + '"JSON数组显示角标","高亮显示","错误提示","\\u003e","&nbsp;","","<h1>JSON在线解析</h1>"],'
    + '"About":{"QQ":661275469},"Special":["&currency","$%^&*(@)"],'
    + '"active":true,"score":98.5,"vip":null,"items":[{"sku":"A-1","qty":2},{"sku":"B-7","qty":1}]}';

  var el = {
    input: document.getElementById('input'),
    keepEsc: document.getElementById('keepEsc'),
    out: document.getElementById('out'),
    outTitle: document.getElementById('outTitle'),
    stats: document.getElementById('stats'),
    warn: document.getElementById('warn'),
    segIndent: document.getElementById('segIndent'),
    segSort: document.getElementById('segSort'),
    segMode: document.getElementById('segMode')
  };

  var opts = { indent: '2', sort: 'keep', mode: 'pretty', keepEsc: false };
  var last = { text: '', ok: false };
  var data = null;

  function esc(s) { return TB.escapeHtml(s); }

  /* ------------------------------------------------ 输入区原格式高亮
     逐 token 扫描，不改变文字内容，只加颜色；保留原始缩进与换行 */
  var RE_TOK = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],:])|(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|(\s+)|(.)/g;

  function rawHighlight(text) {
    var html = '';
    var m;
    RE_TOK.lastIndex = 0;
    while ((m = RE_TOK.exec(text))) {
      if (m[1] !== undefined) {
        // 字符串：后面跟冒号的是键名
        html += m[2]
          ? '<span class="jk">' + esc(m[1]) + '</span><span class="jp">' + esc(m[2]) + '</span>'
          : '<span class="jstr">' + esc(m[1]) + '</span>';
      } else if (m[3] !== undefined) {
        html += '<span class="jnum">' + esc(m[3]) + '</span>';
      } else if (m[4] !== undefined) {
        html += '<span class="jbool">' + esc(m[4]) + '</span>';
      } else if (m[5] !== undefined) {
        html += '<span class="jp">' + esc(m[5]) + '</span>';
      } else if (m[6] !== undefined) {
        html += '<span class="tok-comment">' + esc(m[6]) + '</span>';
      } else {
        html += esc(m[0]);
      }
    }
    return { code: html };
  }

  /* ------------------------------------------------ 表格视图 */
  function cellHtml(v) {
    if (v === null) return '<span class="jnull">null</span>';
    switch (typeof v) {
      case 'string': return '<span class="jstr">' + esc(v) + '</span>';
      case 'number': return '<span class="jnum">' + String(v) + '</span>';
      case 'boolean': return '<span class="jbool">' + String(v) + '</span>';
    }
    var s = JSON.stringify(v);
    if (s.length > 80) s = s.slice(0, 80) + '…';
    return '<span class="nested" title="' + esc(JSON.stringify(v)) + '">' + esc(s) + '</span>';
  }

  // 通用表格数据：返回 { headers, rows }，供 HTML / CSV / MD 共用
  function tableData(data) {
    var plain = function (v) {
      if (v === null) return 'null';
      if (typeof v === 'object') return JSON.stringify(v);
      return String(v);
    };
    if (Array.isArray(data)) {
      var cols = [];
      var seen = {};
      data.forEach(function (item) {
        if (item && typeof item === 'object' && !Array.isArray(item)) {
          Object.keys(item).forEach(function (k) {
            if (!seen[k]) { seen[k] = true; cols.push(k); }
          });
        }
      });
      var headers = cols.length ? cols : ['value'];
      var rows = data.map(function (item) {
        if (cols.length) {
          return headers.map(function (k) {
            var v = (item && typeof item === 'object' && !Array.isArray(item)) ? item[k] : undefined;
            return v === undefined ? '' : plain(v);
          });
        }
        return [plain(item)];
      });
      return { headers: headers, rows: rows };
    }
    if (data && typeof data === 'object') {
      return {
        headers: ['键', '值'],
        rows: Object.keys(data).map(function (k) { return [k, plain(data[k])]; })
      };
    }
    return { headers: ['值'], rows: [[plain(data)]] };
  }

  function buildTable(data) {
    var t = tableData(data);
    var html = '<table><thead><tr><th class="rownum">#</th>';
    t.headers.forEach(function (k) { html += '<th>' + esc(k) + '</th>'; });
    html += '</tr></thead><tbody>';
    t.rows.forEach(function (row, i) {
      html += '<tr><td class="rownum">' + (i + 1) + '</td>';
      row.forEach(function (cell) { html += '<td>' + cellHtml(cell) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table>';
    var note = t.rows.length + ' 行 × ' + t.headers.length + ' 列';
    return { html: html, note: note, headers: t.headers, rows: t.rows };
  }

  /* CSV：逗号/引号/换行转义，带 BOM 方便 Excel 打开中文 */
  function csvCell(s) {
    if (/[,"\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function toCsv(t) {
    var lines = [t.headers.map(csvCell).join(',')];
    t.rows.forEach(function (row) {
      lines.push(row.map(csvCell).join(','));
    });
    return '\uFEFF' + lines.join('\r\n') + '\r\n';
  }
  function toMd(t) {
    var md = '| # | ' + t.headers.map(function (h) {
      return String(h).replace(/\|/g, '\\|').replace(/\n/g, '<br>');
    }).join(' | ') + ' |\n';
    md += '| - ' + t.headers.map(function () { return '| - '; }).join('') + '|\n';
    t.rows.forEach(function (row, i) {
      md += '| ' + (i + 1) + ' | ' + row.map(function (c) {
        return String(c).replace(/\|/g, '\\|').replace(/\n/g, '<br>');
      }).join(' | ') + ' |\n';
    });
    return md;
  }
  function downloadText(text, ext) {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var name = 'table-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
      + '-' + p(d.getHours()) + p(d.getMinutes()) + '.' + ext;
    var mime = ext === 'csv' ? 'text/csv;charset=utf-8' : 'text/markdown;charset=utf-8';
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  var currentTable = null;

  function openTable() {
    if (!last.ok || data == null) { TB.toast('请先格式化出有效的 JSON'); return; }
    var r = buildTable(data);
    currentTable = r;
    document.getElementById('tableOut').innerHTML = r.html;
    document.getElementById('tableNote').textContent = r.note;
    document.getElementById('tableModal').classList.remove('hidden');
  }
  function closeTable() {
    document.getElementById('tableModal').classList.add('hidden');
  }

  /* 剥离注释（// 与 /*），跳过字符串内部，避免误伤值里的双斜杠 */
  function stripJsonComments(src) {
    var out = '';
    var i = 0, n = src.length;
    var inStr = false;
    var commentCount = 0;
    while (i < n) {
      var c = src[i];
      if (inStr) {
        out += c;
        if (c === '\\') { out += src[i + 1] || ''; i += 2; continue; }
        if (c === '"') inStr = false;
        i++;
        continue;
      }
      if (c === '"') { inStr = true; out += c; i++; continue; }
      if (c === '/' && src[i + 1] === '/') {
        commentCount++;
        while (i < n && src[i] !== '\n') i++;
        out += '\n';
        continue;
      }
      if (c === '/' && src[i + 1] === '*') {
        commentCount++;
        var end = src.indexOf('*/', i + 2);
        if (end < 0) { i = n; out += '\n'; break; }
        var nl = (src.slice(i, end + 2).match(/\n/g) || []).length;
        for (var k = 0; k < nl; k++) out += '\n';
        i = end + 2;
        continue;
      }
      out += c;
      i++;
    }
    return { text: out, comments: commentCount };
  }

  /* ------------------------------------------------ 值的着色 */
  function valueHtml(v) {
    if (v === null) return '<span class="jnull">null</span>';
    switch (typeof v) {
      case 'string': return '<span class="jstr">"' + esc(v) + '"</span>';
      case 'number': return '<span class="jnum">' + String(v) + '</span>';
      case 'boolean': return '<span class="jbool">' + String(v) + '</span>';
      default: return esc(String(v));
    }
  }

  function entriesOf(v) {
    return Array.isArray(v)
      ? v.map(function (x) { return { key: null, val: x }; })
      : Object.keys(v).map(function (k) { return { key: k, val: v[k] }; });
  }

  /* ------------------------------------------------ 树渲染 */
  // 生成一行：<缩进><开关>键: 值[,]
  function primLine(indent, key, val, comma, toggle, nodeClass) {
    var h = '<div class="jline' + (nodeClass ? ' ' + nodeClass : '') + '">'
      + '<span class="jln"></span>'
      + '<span class="jcode">'
      + '<span class="jt' + (toggle ? '' : ' leaf') + '"' + (toggle ? ' data-toggle="1"' : '') + '></span>'
      + indent;
    if (key !== null) {
      h += '<span class="jk">"' + esc(key) + '"</span><span class="jp">: </span>';
    }
    h += valueHtml(val);
    if (comma) h += '<span class="jp">,</span>';
    return h + '</span></div>';
  }

  function containerLine(indent, key, openCh, comma, isEmpty) {
    var h = '<div class="jline">'
      + '<span class="jln"></span>'
      + '<span class="jcode">'
      + '<span class="jt' + (isEmpty ? ' leaf' : '') + '"' + (isEmpty ? '' : ' data-toggle="1"') + '></span>'
      + indent;
    if (key !== null) h += '<span class="jk">"' + esc(key) + '"</span><span class="jp">: </span>';
    // 开括号本身也可点击折叠
    h += '<span class="jp jclick"' + (isEmpty ? '' : ' data-toggle="1"') + '>' + openCh + '</span>';
    if (comma) h += '<span class="jp">,</span>';
    return h + '</span></div>';
  }

  function renderNode(v, key, depth, comma, pad) {
    var indent = pad.repeat(depth);

    if (v === null || typeof v !== 'object') {
      return primLine(indent, key, v, comma, false);
    }

    var isArr = Array.isArray(v);
    var open = isArr ? '[' : '{';
    var close = isArr ? ']' : '}';
    var entries = entriesOf(v);
    var h = '';

    if (entries.length === 0) {
      // 空对象 / 空数组
      var one = indent + (key !== null ? '"' + esc(key) + '": ' : '') + open + close + (comma ? ',' : '');
      return '<div class="jline"><span class="jln"></span><span class="jcode">'
        + '<span class="jt leaf"></span>' + one + '</span></div>';
    }

    h += '<div class="jnode" style="--d:' + depth + '">';
    h += containerLine(indent, key, open, comma, false);
    h += '<div class="jchildren">';
    entries.forEach(function (e, i) {
      h += renderNode(e.val, e.key, depth + 1, i < entries.length - 1, pad);
    });
    h += '</div>';
    // 折叠时的摘要
    h += '<div class="jdots">'
      + '<div class="jline"><span class="jln"></span><span class="jcode">'
      + indent + pad + '<span class="jsummary">… ' + entries.length + ' 项</span>'
      + '</span></div></div>';
    // 结束符号与开始符号对齐：补一个和红方块同宽的占位
    h += '<div class="jline jclose"><span class="jln"></span><span class="jcode">'
      + '<span class="jt leaf"></span>' + indent
      + '<span class="jp">' + close + '</span></span></div>';
    h += '</div>';
    return h;
  }

  /* ------------------------------------------------ 渲染主流程 */
  function renderTree() {
    if (!data) return;
    var pad = opts.indent === 'tab' ? '\t' : (opts.indent === '4' ? '    ' : '  ');
    el.out.innerHTML = renderNode(data, null, 0, false, pad);

    var lines = countLines(data, pad);
    el.stats.textContent = lines + ' 行 · ' + last.text.length + ' 字符';
  }

  function countLines(v, pad) {
    // 展开状态下的行数 = JSON.stringify 的行数
    return last.text ? last.text.split('\n').length : 1;
  }

  /* 把浏览器原始报错翻译成友好提示，并计算行号/列号 */
  function friendlyError(errMsg, src) {
    var line = 0, col = 0;
    var pm = /position (\d+)/i.exec(errMsg);
    if (pm && src) {
      var pos = Math.min(+pm[1], src.length);
      var before = src.slice(0, pos);
      line = before.split('\n').length;
      col = pos - before.lastIndexOf('\n');
    }
    var tip;
    var s = errMsg;
    if (/Unexpected end of JSON input/i.test(s)) {
      tip = 'JSON 不完整：可能缺少结尾的 } 或 ]，或字符串引号没有闭合';
    } else if (/Expected property name/i.test(s)) {
      tip = '键名必须用英文双引号包裹（如 "name"），不能单引号或不加引号；也检查上一行末尾是否多了逗号';
    } else if (/Expected double-quoted/i.test(s)) {
      tip = '键名必须用英文双引号包裹';
    } else if (/Expected ',' or '\}'/i.test(s)) {
      tip = '对象里可能少了逗号，或 } 没有闭合；也检查是否用了中文逗号';
    } else if (/Expected ',' or '\]'/i.test(s)) {
      tip = '数组里可能少了逗号，或 ] 没有闭合；也检查是否用了中文逗号';
    } else if (/non-whitespace/i.test(s)) {
      tip = 'JSON 已经结束，但后面还有多余的内容：检查是否多了字符或多了 ] }';
    } else if (/Unexpected token/i.test(s)) {
      var tok = /Unexpected token (.+?)[ ,]/i.exec(s);
      tip = '出现意外的字符' + (tok ? '「' + tok[1] + '」' : '')
        + '：检查上一行是否少了逗号、字符串是否用了单引号或中文引号';
    } else if (/No number after minus/i.test(s)) {
      tip = '负号 - 后面必须是数字';
    } else if (/Bad escaped/i.test(s)) {
      tip = '字符串里的反斜杠 \\ 使用不正确（如想表示 \\ 本身要写 \\\\ ）';
    } else if (/Bad control/i.test(s)) {
      tip = '字符串里包含了不允许的换行/控制字符，请改用 \\n 转义';
    } else {
      tip = s;
    }
    var loc = line ? '第 ' + line + ' 行第 ' + col + ' 列附近：' : '';
    return loc + tip;
  }

  function showError(msg) {
    el.out.innerHTML = '<div class="empty error"><strong>JSON 无法解析</strong>'
      + '<span style="white-space:normal;line-height:1.8;max-width:26em">' + esc(msg) + '</span></div>';
    el.stats.textContent = '';
    el.outTitle.textContent = '解析失败';
    last = { text: '', ok: false };
  }

  function indentation() {
    return opts.indent === 'tab' ? '\t' : parseInt(opts.indent, 10) || 2;
  }

  function sortDeep(v) {
    if (Array.isArray(v)) return v.map(sortDeep);
    if (v && typeof v === 'object') {
      var out = {};
      Object.keys(v).sort(function (a, b) { return a.localeCompare(b); })
        .forEach(function (k) { out[k] = sortDeep(v[k]); });
      return out;
    }
    return v;
  }

  function parseInput() {
    var src = el.input.value.trim();
    if (!src) return { empty: true };
    var stripped = stripJsonComments(src);
    var text = stripped.text;
    if (opts.keepEsc) {
      // 保留 \uXXXX 转义：把反斜杠双写，解析后就是字面量文本「\u003e」
      text = text.replace(/\\u([0-9a-fA-F]{4})/g, '\\\\u$1');
    }
    try { return { data: JSON.parse(text), comments: stripped.comments }; }
    catch (e) { return { error: e.message, comments: stripped.comments }; }
  }

  function run() {
    var trimmed = el.input.value.trim();

    el.warn.textContent = '';
    el.warn.classList.remove('show');

    if (!trimmed) {
      el.out.innerHTML = '<div class="empty"><strong>格式化结果会显示在这里</strong>'
        + '<span>粘贴 JSON，按 <kbd data-kbd>⌘⏎</kbd> 立即排版</span></div>';
      el.stats.textContent = '';
      el.outTitle.textContent = '格式化结果';
      data = null; last = { text: '', ok: false };
      return;
    }

    var res = parseInput();
    if (res.error) {
      var friendly = friendlyError(res.error, el.input.value);
      el.warn.textContent = '⚠ ' + friendly;
      el.warn.classList.add('show');
      showError(friendly);
      return;
    }

    data = opts.sort === 'asc' ? sortDeep(res.data) : res.data;
    last.text = opts.mode === 'compress'
      ? JSON.stringify(data)
      : JSON.stringify(data, null, indentation());
    last.ok = true;
    el.outTitle.textContent = opts.mode === 'compress' ? '压缩结果' : '格式化结果';
    if (opts.mode === 'compress') {
      // 压缩模式：直接显示压缩后的单行文本，不走折叠树
      el.out.innerHTML = '<div class="line"><span class="ln">1</span>'
        + '<span class="code">' + rawHighlight(last.text).code + '</span></div>';
      el.stats.textContent = '1 行 · ' + last.text.length + ' 字符';
    } else {
      renderTree();
    }
    if (res.comments > 0) {
      el.warn.textContent = 'ℹ 已忽略 ' + res.comments + ' 段注释（// 与 /* */）；复制 / 下载的结果不含注释';
      el.warn.classList.add('show');
    }
  }

  var runSoon = TB.debounce(run, 180);

  /* ------------------------------------------------ 折叠交互 */
  el.out.addEventListener('click', function (e) {
    var t = e.target.closest('.jt, .jclick');
    if (!t || t.classList.contains('leaf')) return;
    var node = t.closest('.jnode');
    if (node) node.classList.toggle('collapsed');
    e.stopPropagation();
  });

  function setAll(collapse) {
    Array.prototype.forEach.call(el.out.querySelectorAll('.jnode'), function (n) {
      n.classList.toggle('collapsed', collapse);
    });
    updateToggleLabel();
  }

  // 展开/折叠合并为一个智能切换按钮：有折叠就全部展开，否则全部折叠
  function updateToggleLabel() {
    var anyCollapsed = !!el.out.querySelector('.jnode.collapsed');
    document.getElementById('toggleBtn').textContent = anyCollapsed ? '全部展开' : '全部折叠';
  }

  document.getElementById('toggleBtn').addEventListener('click', function () {
    // 压缩模式下先回到格式化（树形）视图
    if (opts.mode !== 'pretty') {
      opts.mode = 'pretty';
      TB.syncSeg(el.segMode, 'pretty');
      run();
      updateToggleLabel();
      TB.toast('已切换到格式化视图');
      return;
    }
    var anyCollapsed = !!el.out.querySelector('.jnode.collapsed');
    setAll(!anyCollapsed);
  });

  /* ------------------------------------------------ 分段控件 */
  TB.bindSeg(el.segMode, opts.mode, function (v) {
    opts.mode = v;
    run();
    TB.toast(v === 'compress' ? '已压缩为单行' : '已切换到格式化');
  });
  TB.bindSeg(el.segIndent, opts.indent, function (v) {
    opts.indent = v; opts.mode = 'pretty'; TB.syncSeg(el.segMode, 'pretty'); run();
  });
  TB.bindSeg(el.segSort, opts.sort, function (v) {
    opts.sort = v; run();
  });

  // 保留转义开关（记忆偏好）
  var ESC_KEY = 'devtoolbox.json.keepesc.v1';
  try { opts.keepEsc = localStorage.getItem(ESC_KEY) === '1'; } catch (e) {}
  el.keepEsc.checked = opts.keepEsc;
  el.keepEsc.addEventListener('change', function () {
    opts.keepEsc = el.keepEsc.checked;
    try { localStorage.setItem(ESC_KEY, opts.keepEsc ? '1' : '0'); } catch (e) {}
    run();
  });

  /* ------------------------------------------------ 按钮 */
  document.getElementById('sampleBtn').addEventListener('click', function () {
    opts.mode = 'pretty';
    TB.syncSeg(el.segMode, 'pretty');
    el.input.value = SAMPLE;
    run();
    el.input.focus();
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!last.ok) { TB.toast('还没有可复制的结果'); return; }
    TB.copyWithToast(last.text, last.text.indexOf('\n') === -1 ? '压缩后的 JSON' : '格式化后的 JSON');
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    if (!last.ok) { TB.toast('还没有可下载的结果'); return; }
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    var name = 'data-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
      + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
    var blob = new Blob([last.text + '\n'], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    TB.toast('已下载 .json 文件');
  });

  /* ------------------------------------------------ 交互细节 */
  TB.bindRunKey(run);
  TB.enableTabIndent(el.input, 2);

  el.input.addEventListener('input', runSoon);
  el.input.addEventListener('paste', function () { setTimeout(run, 0); });

  /* ------------------------------------------------ 表格视图事件 */
  document.getElementById('tableBtn').addEventListener('click', openTable);
  document.getElementById('tableCloseBtn').addEventListener('click', closeTable);
  document.getElementById('csvBtn').addEventListener('click', function () {
    if (!currentTable) { TB.toast('没有表格数据'); return; }
    downloadText(toCsv(currentTable), 'csv');
    TB.toast('已下载 CSV（带 BOM，Excel 可直接打开）');
  });
  document.getElementById('mdBtn').addEventListener('click', function () {
    if (!currentTable) { TB.toast('没有表格数据'); return; }
    downloadText(toMd(currentTable), 'md');
    TB.toast('已下载 Markdown 表格');
  });
  document.getElementById('tableModal').addEventListener('click', function (e) {
    if (e.target === this) closeTable();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeTable();
  });

  ['dragover', 'drop'].forEach(function (t) {
    el.input.addEventListener(t, function (e) { e.preventDefault(); });
  });
  el.input.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      el.input.value = String(r.result || '');
      run();
      TB.toast('已载入 ' + f.name);
    };
    r.readAsText(f, 'utf-8');
  });

  /* ------------------------------------------------ 全屏 */
  TB.bindFullscreenButton(document.getElementById('fullBtn'));

  /* ------------------------------------------------ 启动 */
  el.input.value = SAMPLE;
  run();
  // 光标定位到文本末尾
  el.input.setSelectionRange(el.input.value.length, el.input.value.length);
})();
</script>
</body>
</html>
