<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本对比 · DevToolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M11 12h10M11 20h10' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/app.css?v=202610271643">
<script src="../js/app.js?v=202610271643"></script>
<script src="../js/vendor/diff.min.js?v=202610271643"></script>
<style>
  /* ---------- IDEA 风格左右对比 ---------- */
  .result-pane { flex: 1 1 auto; min-height: 300px; }

  .sbs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    font-size: 12.5px;
    line-height: 1.65;
    padding: 0;
  }
  .sbs-row {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
  }
  /* 左右两个半区，各自带行号列 */
  .side {
    display: grid;
    grid-template-columns: 1.2em 3.2em 1fr;
    min-width: 0;
  }
  .side.right { border-left: 1px solid var(--border-soft); }

  /* 行首符号：+ 新增 / − 删除 / M 修改 */
  .sign {
    text-align: center;
    color: var(--muted);
    opacity: .5;
    user-select: none;
    -webkit-user-select: none;
    font-weight: 700;
  }

  .num {
    text-align: right;
    padding: 0 8px 0 6px;
    color: var(--muted);
    opacity: .6;
    user-select: none;
    -webkit-user-select: none;
    font-variant-numeric: tabular-nums;
    background: var(--panel-head);
  }
  .txt {
    padding: 0 10px;
    white-space: pre-wrap;
    word-break: break-word;
    min-width: 0;
  }

  /* 状态着色：修改 M=淡黄，新增 +=绿，删除 −=粉红，全部跟随主题 */
  .sbs-row.add  .num, .sbs-row.add  .txt, .sbs-row.add  .sign {
    background: var(--add-bg);
    color: var(--add-fg);
  }
  .sbs-row.add .sign, .sbs-row.add .num { opacity: 1; }
  .sbs-row.del  .num, .sbs-row.del  .txt, .sbs-row.del  .sign {
    background: var(--del-bg);
    color: var(--del-fg);
  }
  .sbs-row.del .sign, .sbs-row.del .num { opacity: 1; }
  .sbs-row.mod  .num, .sbs-row.mod  .txt, .sbs-row.mod  .sign {
    background: var(--mod-bg);
    color: var(--mod-fg);
  }
  .sbs-row.mod .sign, .sbs-row.mod .num { opacity: 1; }

  .sbs-row:hover .txt { filter: brightness(1.06); }

  /* 折叠提示行：横跨左右两栏 */
  .skip-row {
    display: grid;
    grid-template-columns: subgrid;
    grid-column: 1 / -1;
    background: var(--panel-head);
    color: var(--muted);
    font-size: 12px;
  }
  .skip-row > div {
    padding: 3px 12px;
    border-bottom: 1px solid var(--border-soft);
    border-top: 1px solid var(--border-soft);
  }
  .skip-row > div:last-child { border-left: 1px solid var(--border-soft); }

  /* 空占位（单侧有内容另一侧为空时） */
  .txt.empty-cell { background: rgba(127,127,127,.04); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a class="brand-link" href="../index.html" title="返回首页">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h4M15 12h4"/>
          </svg>
        </div>
        <div>
          <h1>文本对比</h1>
          <p class="sub">IDEA 式左右对照，同步滚动；修改行黄色、新增绿色、删除红色</p>
        </div>
      </a>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="opts">
      <div class="opt">
        <span class="opt-label">空白</span>
        <div class="seg" id="segWs" role="group" aria-label="空白处理">
          <button data-value="strict">严格比较</button>
          <button data-value="ignore">忽略空白差异</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">未变行</span>
        <div class="seg" id="segCtx" role="group" aria-label="未变行折叠">
          <button data-value="collapse">折叠</button>
          <button data-value="full">全部显示</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn">示例</button>
      <button class="btn" id="swapBtn">交换 A/B</button>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="fullBtn">全屏</button>
      <button class="btn" id="copyBtn">复制差异</button>
      <button class="btn primary" id="diffBtn">开始对比 <kbd data-kbd>⌘⏎</kbd></button>
    </div>
  </div>

  <main class="panes">
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title">文本 A · 原文本</span>
        <div class="pane-tools"><span class="stats" id="statsA"></span></div>
      </div>
      <textarea id="a" spellcheck="false" placeholder="粘贴原始版本…"></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">
        <span class="pane-title">文本 B · 新文本</span>
        <div class="pane-tools"><span class="stats" id="statsB"></span></div>
      </div>
      <textarea id="b" spellcheck="false" placeholder="粘贴修改后的版本…"></textarea>
    </section>
  </main>

  <section class="pane result-pane">
    <div class="pane-head">
      <span class="pane-title">对比结果（左右同步滚动）</span>
      <div class="pane-tools">
        <span class="hint">修改 M 黄 · 新增 + 绿 · 删除 − 粉</span>
        <span class="diff-stat" id="stat"></span>
      </div>
    </div>
    <div class="out sbs" id="out">
      <div class="empty" style="grid-column: 1 / -1"><strong>差异会显示在这里</strong>
        <span>填入两段文本，按 <kbd data-kbd>⌘⏎</kbd> 开始对比</span></div>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var el = {
    a: document.getElementById('a'),
    b: document.getElementById('b'),
    out: document.getElementById('out'),
    stat: document.getElementById('stat'),
    statsA: document.getElementById('statsA'),
    statsB: document.getElementById('statsB'),
    segWs: document.getElementById('segWs'),
    segCtx: document.getElementById('segCtx')
  };

  var opts = { ignore: false, collapse: true };

  function esc(s) { return TB.escapeHtml(s); }
  function countLines(t) { return t ? t.split('\n').length : 0; }

  function updateCounts() {
    el.statsA.textContent = countLines(el.a.value) + ' 行';
    el.statsB.textContent = countLines(el.b.value) + ' 行';
  }

  function splitLines(v) {
    var arr = v.split('\n');
    if (arr.length && arr[arr.length - 1] === '') arr.pop();
    return arr;
  }

  /* ------------------------------------------------ 构建对齐行
     row: { type: same|mod|add|del, l, r, lnL, lnR } */
  function buildRows(parts) {
    var rows = [];
    var lnL = 0, lnR = 0;
    var pendingDel = null;   // 待与新增配对的删除块

    function flushDel() {
      if (!pendingDel) return;
      pendingDel.forEach(function (line) {
        lnL++;
        rows.push({ type: 'del', l: line, r: null, lnL: lnL, lnR: null });
      });
      pendingDel = null;
    }

    parts.forEach(function (part) {
      if (part.added) {
        var adds = splitLines(part.value);
        if (pendingDel) {
          // 删除块紧跟新增块 → 逐行配对为「修改」
          var n = Math.min(pendingDel.length, adds.length);
          for (var i = 0; i < n; i++) {
            lnL++; lnR++;
            rows.push({ type: 'mod', l: pendingDel[i], r: adds[i], lnL: lnL, lnR: lnR });
          }
          for (var j = n; j < pendingDel.length; j++) {
            lnL++;
            rows.push({ type: 'del', l: pendingDel[j], r: null, lnL: lnL, lnR: null });
          }
          for (var k = n; k < adds.length; k++) {
            lnR++;
            rows.push({ type: 'add', l: null, r: adds[k], lnL: null, lnR: lnR });
          }
          pendingDel = null;
        } else {
          adds.forEach(function (line) {
            lnR++;
            rows.push({ type: 'add', l: null, r: line, lnL: null, lnR: lnR });
          });
        }
      } else if (part.removed) {
        flushDel();
        pendingDel = splitLines(part.value);
      } else {
        flushDel();
        splitLines(part.value).forEach(function (line) {
          lnL++; lnR++;
          rows.push({ type: 'same', l: line, r: line, lnL: lnL, lnR: lnR });
        });
      }
    });
    flushDel();
    return rows;
  }

  /* ------------------------------------------------ 渲染 */
  function sideHtml(cls, ln, text, empty, sign) {
    return '<div class="side ' + cls + '">'
      + '<div class="sign">' + sign + '</div>'
      + '<div class="num">' + (ln == null ? '' : ln) + '</div>'
      + '<div class="txt' + (empty ? ' empty-cell' : '') + '">' + esc(text) + '</div>'
      + '</div>';
  }

  function rowHtml(row) {
    var lSign = row.type === 'mod' ? 'M' : row.type === 'del' ? '−' : '';
    var rSign = row.type === 'mod' ? 'M' : row.type === 'add' ? '+' : '';
    return '<div class="sbs-row ' + row.type + '">'
      + sideHtml('left', row.lnL, row.l, row.l == null, lSign)
      + sideHtml('right', row.lnR, row.r, row.r == null, rSign)
      + '</div>';
  }

  function skipHtml(n) {
    return '<div class="skip-row"><div>⋯ 跳过 ' + n + ' 行未变内容 ⋯</div>'
      + '<div>⋯ 跳过 ' + n + ' 行未变内容 ⋯</div></div>';
  }

  function run() {
    updateCounts();
    var a = el.a.value, b = el.b.value;

    if (!a && !b) {
      el.out.innerHTML = '<div class="empty" style="grid-column:1/-1"><strong>差异会显示在这里</strong>'
        + '<span>填入两段文本，按 <kbd data-kbd>⌘⏎</kbd> 开始对比</span></div>';
      el.stat.textContent = '';
      return;
    }

    var parts = window.Diff.diffLines(a, b, { ignoreWhitespace: opts.ignore });
    var rows = buildRows(parts);

    var mods = 0, adds = 0, dels = 0;
    rows.forEach(function (r) {
      if (r.type === 'mod') mods++;
      else if (r.type === 'add') adds++;
      else if (r.type === 'del') dels++;
    });

    // 未变行折叠
    var html = [];
    var CTX = 3;
    var i = 0;
    while (i < rows.length) {
      if (rows[i].type !== 'same') { html.push(rowHtml(rows[i])); i++; continue; }

      var j = i;
      while (j < rows.length && rows[j].type === 'same') j++;
      var runLen = j - i;

      if (!opts.collapse || runLen <= CTX * 2 + 1) {
        for (var k = i; k < j; k++) html.push(rowHtml(rows[k]));
      } else {
        for (var h1 = i; h1 < i + CTX; h1++) html.push(rowHtml(rows[h1]));
        var hidden = (j - CTX) - (i + CTX);
        if (hidden > 0) html.push(skipHtml(hidden));
        for (var h2 = j - CTX; h2 < j; h2++) html.push(rowHtml(rows[h2]));
      }
      i = j;
    }

    el.out.innerHTML = html.length ? html.join('')
      : '<div class="empty" style="grid-column:1/-1"><strong>两段文本完全相同</strong>'
        + '<span>没有任何差异</span></div>';

    el.stat.innerHTML =
      (mods ? '<span style="color:#eab308">' + mods + ' 处修改</span>' : '')
      + (adds ? ' <span class="plus">+' + adds + '</span>' : '')
      + (dels ? ' <span class="minus">-' + dels + '</span>' : '');

    document.title = '文本对比 (' + mods + '改 +' + adds + ' -' + dels + ') · DevToolbox';
    TB.toast(mods || adds || dels
      ? '已对比：' + mods + ' 处修改，+' + adds + '，-' + dels
      : '两段文本完全相同');
  }

  /* ------------------------------------------------ 控件 */
  TB.bindSeg(el.segWs, opts.ignore ? 'ignore' : 'strict', function (v) {
    opts.ignore = (v === 'ignore'); run();
  });
  TB.bindSeg(el.segCtx, opts.collapse ? 'collapse' : 'full', function (v) {
    opts.collapse = (v === 'collapse'); run();
  });

  document.getElementById('diffBtn').addEventListener('click', run);

  document.getElementById('sampleBtn').addEventListener('click', function () {
    el.a.value = [
      '-- 用户表同步任务 v1.2',
      'insert overwrite table dw.user_profile partition (ds="2026-10-26")',
      'select',
      '    user_id,',
      '    user_name,',
      '    age,',
      '    city_code,',
      '    register_time,',
      '    status',
      'from ods.user_info',
      'where ds = "2026-10-26";'
    ].join('\n');
    el.b.value = [
      '-- 用户表同步任务 v1.3',
      'insert overwrite table dw.user_profile partition (ds="${bizdate}")',
      'select',
      '    user_id,',
      '    user_name,',
      '    case when age < 0 then null else age end as age,',
      '    city_code,',
      '    register_time,',
      '    status,',
      '    last_login_time,',
      '    tag_list',
      'from ods.user_info',
      'where ds = "${bizdate}"',
      '  and user_id > 0;'
    ].join('\n');
    run();
    TB.toast('已载入示例：黄色=修改，绿色=新增，红色=删除');
  });

  document.getElementById('swapBtn').addEventListener('click', function () {
    var t = el.a.value;
    el.a.value = el.b.value;
    el.b.value = t;
    run();
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    el.a.value = '';
    el.b.value = '';
    run();
    el.a.focus();
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    var lines = [];
    document.querySelectorAll('#out .sbs-row').forEach(function (r) {
      var l = r.querySelector('.side.left .txt').textContent;
      var rr = r.querySelector('.side.right .txt').textContent;
      var type = r.classList.contains('mod') ? 'M'
        : r.classList.contains('add') ? '+' : r.classList.contains('del') ? '-' : ' ';
      lines.push(type + ' ' + (l || rr));
    });
    TB.copyWithToast(lines.join('\n'), '差异文本');
  });

  TB.bindRunKey(run);
  TB.bindFullscreenButton(document.getElementById('fullBtn'));
  TB.enableTabIndent(el.a, 2);
  TB.enableTabIndent(el.b, 2);

  /* ------------------------------------------------ 输入后自动对比 */
  var runSoon = TB.debounce(run, 300);
  el.a.addEventListener('input', function () { updateCounts(); runSoon(); });
  el.b.addEventListener('input', function () { updateCounts(); runSoon(); });
  el.a.addEventListener('paste', function () { setTimeout(function () { updateCounts(); run(); }, 0); });
  el.b.addEventListener('paste', function () { setTimeout(function () { updateCounts(); run(); }, 0); });

  /* ------------------------------------------------ 输入区同步滚动
     按滚动比例同步，另一侧拖动时本侧不回写，避免死循环 */
  var syncing = false;

  function syncScroll(src, dst) {
    if (syncing) return;
    syncing = true;
    var srcMax = src.scrollHeight - src.clientHeight;
    var dstMax = dst.scrollHeight - dst.clientHeight;
    if (srcMax > 0 && dstMax > 0) {
      dst.scrollTop = (src.scrollTop / srcMax) * dstMax;
    } else {
      dst.scrollTop = src.scrollTop;
    }
    syncing = false;
  }

  el.a.addEventListener('scroll', function () { syncScroll(el.a, el.b); });
  el.b.addEventListener('scroll', function () { syncScroll(el.b, el.a); });

  updateCounts();
})();
</script>
</body>
</html>
