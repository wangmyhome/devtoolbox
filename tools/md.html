<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 编辑预览 · DevToolbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M8 22V10l6 6 6-6v12' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/app.js"></script>
<script src="../js/vendor/marked.min.js"></script>
<style>
  .md-pane { min-height: 460px; }
  .stats-sep { color: var(--border); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <a class="brand-link" href="../index.html" title="返回首页">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 18V7l4 5 4-5v11"/>
          </svg>
        </div>
        <div>
          <h1>Markdown 编辑预览</h1>
          <p class="sub">左边写、右边看；草稿自动保存在本机</p>
        </div>
      </a>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="切换浅色 / 深色" aria-label="切换主题">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="opts">
      <div class="opt">
        <span class="opt-label">视图</span>
        <div class="seg" id="segView" role="group" aria-label="视图模式">
          <button data-value="both">分栏</button>
          <button data-value="edit">仅编辑</button>
          <button data-value="preview">仅预览</button>
        </div>
      </div>
      <div class="opt">
        <span class="opt-label">换行</span>
        <div class="seg" id="segBreak" role="group" aria-label="单换行处理">
          <button data-value="soft">同段落</button>
          <button data-value="hard">强制换行</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="sampleBtn">示例</button>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn" id="copyMdBtn">复制 MD</button>
      <button class="btn" id="copyHtmlBtn">复制 HTML</button>
      <button class="btn primary" id="downloadBtn">下载 .md</button>
    </div>
  </div>

  <main class="panes">
    <section class="pane md-pane" id="editPane">
      <div class="pane-head">
        <span class="pane-title">Markdown</span>
        <div class="pane-tools"><span class="stats" id="statsMd"></span></div>
      </div>
      <textarea id="editor" spellcheck="false"
        placeholder="# 标题&#10;&#10;**加粗**、*斜体*、`行内代码`&#10;&#10;- 列表项&#10;- 另一项"></textarea>
    </section>

    <section class="pane md-pane" id="previewPane">
      <div class="pane-head">
        <span class="pane-title">预览</span>
        <div class="pane-tools">
          <span class="stats" id="statsHtml"></span>
        </div>
      </div>
      <div class="md-body" id="preview"></div>
    </section>
  </main>
</div>

<script>
(function () {
  'use strict';

  var SAMPLE = [
    '# Markdown 示例',
    '',
    '支持 **加粗**、*斜体*、~~删除线~~、`行内代码`，以及 [超链接](https://example.com)。',
    '',
    '## 列表',
    '',
    '- 无序列表项',
    '  - 嵌套项',
    '  - 又一个',
    '- [x] 已完成的任务',
    '- [ ] 待办的任务',
    '',
    '## 表格',
    '',
    '| 工具 | 用途 | 快捷键 |',
    '| --- | --- | --- |',
    '| JSON | 格式化 | ⌘⏎ |',
    '| SQL | 排版 | ⌘⏎ |',
    '| Diff | 对比 | ⌘⏎ |',
    '',
    '## 代码',
    '',
    '```js',
    'function greet(name) {',
    '  return `你好，${name}`;',
    '}',
    '```',
    '',
    '> 引用：内容只保存在浏览器本地，不会上传。',
    '',
    '---',
    '',
    '1. 有序列表第一项',
    '2. 第二项'
  ].join('\n');

  var STORE_KEY = 'devtoolbox.md.draft.v1';
  var el = {
    editor: document.getElementById('editor'),
    preview: document.getElementById('preview'),
    statsMd: document.getElementById('statsMd'),
    statsHtml: document.getElementById('statsHtml'),
    editPane: document.getElementById('editPane'),
    previewPane: document.getElementById('previewPane'),
    segView: document.getElementById('segView'),
    segBreak: document.getElementById('segBreak')
  };

  var opts = { view: 'both', breaks: false };

  window.marked.setOptions({ gfm: true, breaks: opts.breaks });

  function saveDraft() {
    try { localStorage.setItem(STORE_KEY, el.editor.value); } catch (e) {}
  }

  function render() {
    var src = el.editor.value;
    el.preview.innerHTML = window.marked.parse(src);

    var lines = src ? src.split('\n').length : 0;
    var chars = src.replace(/\s/g, '').length;
    el.statsMd.textContent = lines + ' 行 · ' + chars + ' 字';
    el.statsHtml.textContent = el.preview.querySelectorAll('*').length + ' 个元素';
  }

  var renderSoon = TB.debounce(function () {
    render();
    saveDraft();
  }, 220);

  el.editor.addEventListener('input', renderSoon);

  /* ------------------------------------------------ 编辑 ↔ 预览 同步滚动 */
  var syncing = false;

  function bindSync(src, dst) {
    src.addEventListener('scroll', function () {
      if (syncing) return;
      syncing = true;
      var srcMax = src.scrollHeight - src.clientHeight;
      var dstMax = dst.scrollHeight - dst.clientHeight;
      if (srcMax > 0 && dstMax > 0) {
        dst.scrollTop = (src.scrollTop / srcMax) * dstMax;
      }
      syncing = false;
    });
  }
  bindSync(el.editor, el.preview);
  bindSync(el.preview, el.editor);

  el.editor.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab' || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    var s = this.selectionStart;
    this.setRangeText('  ', s, this.selectionEnd, 'end');
    this.dispatchEvent(new Event('input', { bubbles: true }));
  });

  /* ------------------------------------------------ 视图 */
  function applyView(v) {
    opts.view = v;
    el.editPane.style.display = v === 'preview' ? 'none' : '';
    el.previewPane.style.display = v === 'edit' ? 'none' : '';
  }

  TB.bindSeg(el.segView, opts.view, applyView);
  TB.bindSeg(el.segBreak, opts.breaks ? 'hard' : 'soft', function (v) {
    opts.breaks = (v === 'hard');
    window.marked.setOptions({ gfm: true, breaks: opts.breaks });
    render();
  });

  /* ------------------------------------------------ 按钮 */
  document.getElementById('sampleBtn').addEventListener('click', function () {
    el.editor.value = SAMPLE;
    render(); saveDraft();
    TB.toast('已载入示例');
  });

  document.getElementById('clearBtn').addEventListener('click', function () {
    el.editor.value = '';
    render(); saveDraft();
    el.editor.focus();
  });

  document.getElementById('copyMdBtn').addEventListener('click', function () {
    TB.copyWithToast(el.editor.value, 'Markdown 源码');
  });

  document.getElementById('copyHtmlBtn').addEventListener('click', function () {
    TB.copyWithToast(el.preview.innerHTML, '渲染后的 HTML');
  });

  document.getElementById('downloadBtn').addEventListener('click', function () {
    var text = el.editor.value;
    if (!text.trim()) { TB.toast('还没有内容可下载'); return; }
    var firstLine = text.split('\n').find(function (l) { return l.trim(); }) || 'note';
    var name = firstLine.replace(/^#+\s*/, '').replace(/[\/\\:*?"<>|]/g, '').trim().slice(0, 40) || 'note';
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name + '.md';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    TB.toast('已下载 ' + name + '.md');
  });

  /* ------------------------------------------------ 启动 */
  var draft = null;
  try { draft = localStorage.getItem(STORE_KEY); } catch (e) {}
  el.editor.value = draft != null ? draft : SAMPLE;
  render();
  if (draft == null) saveDraft();
})();
</script>
</body>
</html>
